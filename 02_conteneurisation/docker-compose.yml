version: '3.8'

services:
  carehub-portail:
    image: ghcr.io/solazerbig/skill-hub-lite:latest
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD} # Injecté par la CI, jamais écrit en dur
    
    # C13.1 & C13.2 : Mise à l'échelle, Continuité et Ressources
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first # Démarre le nouveau AVANT de tuer l'ancien
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
          
    # Contrôle de santé indispensable pour le Zero Downtime
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
